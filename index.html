<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Webhook Error Parser</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Webhook Error Parser</h1>

    <label>
      <input type="checkbox" id="platformCheckbox" />
      platform company
    </label>

    <textarea id="input" placeholder="Paste raw error text here..."></textarea>
    <button id="parseBtn">Parse</button>

    <textarea id="output" placeholder="Formatted output will appear here..."></textarea>
    <button id="copyBtn">Copy Output</button>

    <div id="errorBox" class="error-box" hidden></div>
  <div class="sticky-note" id="stickyNote">
    <button class="sticky-close" id="closeSticky">×</button>

    <div class="sticky-title">Note</div>
    <div class="sticky-text">
      The parser is still somewhat unstable. Please double-check the generated output before sending it
    </div>
  </div>

    <script>
    const EVENT_ORDER = [
      e => e === 'FORM_SUBMITTED',
      e => e.startsWith('LAB'),
      e => e === 'BOOKING_CREATED',
      e => e.startsWith('BOOKING'),
      e => e === 'RX_WRITTEN',
      e => e === 'PHARMACY_ORDER_IN_FULFILLMENT',
      e => e === 'PHARMACY_ORDER_SHIPPED',
      e => e === 'PHARMACY_ORDER_DELIVERED',
      e => e.startsWith('PHARMACY'),
      e => e === 'CS_MESSAGE',
      e => e === 'DOCTOR_CHAT',
      e => e === 'CONSULT_CONCLUDED',
    ];
 
    const KEY_SEP = '\x00';
    const FIELD_SEP = '\x01';
    const EMAIL_MARKER = 'admin@support.belugahealth.com';
    const CLIPPED_RE = /\[Message clipped\]/i;
 
    function eventPriority(event) {
      const idx = EVENT_ORDER.findIndex(fn => fn(event));
      return idx === -1 ? EVENT_ORDER.length : idx;
    }
 
    function sortByEventPriority(events) {
      return [...events].sort((a, b) => eventPriority(a) - eventPriority(b));
    }
 
    function normalizeText(raw) {
      return raw
        .replace(/\\?[\r\n]+/g, ' ')
        .replace(/[""]/g, '"')
        .replace(/(?<=\w)"(?=\w)/g, '')
        .replace(/\\"+/g, '"');
    }
 
    function serializeError(status, code, event) {
      return [status || '', code || 'unknown', event || 'unknown'].join(FIELD_SEP);
    }
 
    function deserializeError(entry) {
      const [status, code, event] = entry.split(FIELD_SEP);
      return { status, code, event };
    }
 
    function serializeErrorSet(errors) {
      return [...errors].sort().join(KEY_SEP);
    }
 
    function deserializeErrorSet(key) {
      return key.split(KEY_SEP).map(deserializeError);
    }
 
    function groupPriority(errorSetKey) {
      const errors = deserializeErrorSet(errorSetKey);
      return Math.min(...errors.map(e => eventPriority(e.event)));
    }
 
    function extractMasterIdErrors(normalized) {
      const masterIdPattern = /["']?[Mm]aster[Ii]d["']?\s*[:=]\s*["']?([^"'\s,}]+)/g;
      const statusPattern = /["']?status["']?\s*[:=]\s*["']?([0-9]{3}|null)["']?/;
      const codePattern = /["']?code["']?\s*[:=]\s*["']?([A-Z_]+)["']?/;
      const eventPattern = /["']?event["']?\s*[:=]\s*["']?([A-Z_]+)["']?/;
 
      const status = normalized.match(statusPattern)?.[1]?.replace('null', '') || '';
      const code = normalized.match(codePattern)?.[1] ?? 'unknown';
      const event = normalized.match(eventPattern)?.[1] ?? 'unknown';
 
      const masterIds = [...normalized.matchAll(masterIdPattern)].map(m => m[1]);
 
      const found = new Map();
      const missing = [];
 
      if (!masterIds.length) {
        if (event !== 'unknown' || status || code !== 'unknown') {
          missing.push({ event, status, code });
        }
        return { found, missing };
      }
 
      for (const masterId of masterIds) {
        if (!found.has(masterId)) found.set(masterId, new Set());
        found.get(masterId).add(serializeError(status, code, event));
      }
 
      return { found, missing };
    }
 
    function extractCompany(text, isPlatform) {
      if (!text) return null;
 
      const lines = text
        .split(/\r?\n/)
        .map(l => l.trim())
        .filter(Boolean);
 
      const mutedIndex = lines.findIndex(
        line => /^Muted$/i.test(line)
      );
 
      if (mutedIndex <= 0) return null;
 
      const subject = lines[mutedIndex - 1];
      const match = subject.match(/^([a-zA-Z][a-zA-Z0-9_-]*)/);
 
      return match ? match[1] : null;
    }
 
    function splitIntoSegments(raw, isPlatform) {
      if (!raw.includes(EMAIL_MARKER)) {
        return [{
          text: raw.trim(),
          company: extractCompany(raw, isPlatform),
          clipped: CLIPPED_RE.test(raw),
        }];
      }
 
      const parts = raw.split(EMAIL_MARKER);
      const segments = [];
 
      for (let i = 1; i < parts.length; i++) {
        const body = parts[i].trim();
        if (!body) continue;
        const header = (parts[i - 1] || '').trim();
        const company = extractCompany(header, isPlatform);
        segments.push({
          text: body,
          company: company || null,
          clipped: CLIPPED_RE.test(header + '\n' + body),
        });
      }
 
      return segments;
    }
 
    function formatEventList(events) {
      const quoted = [...new Set(events)].map(e => `\`${e}\``).sort((a, b) =>
        eventPriority(a.slice(1, -1)) - eventPriority(b.slice(1, -1))
      );
 
      if (quoted.length === 1) return `${quoted[0]} event`;
      if (quoted.length === 2) return `${quoted[0]} and ${quoted[1]} events`;
      return `${quoted.slice(0, -1).join(', ')} and ${quoted.at(-1)} events`;
    }
 
    function formatMasterIdList(entries, showCompany) {
      const sorted = showCompany
        ? [...entries].sort((a, b) => (a.company || '').localeCompare(b.company || ''))
        : entries;
      const numbered = sorted.length > 10;
      return sorted.map(({ masterId, company }, i) => {
        const companyTag = showCompany && company ? ` for \`${company}\`` : '';
        return numbered
          ? `${i + 1}. \`${masterId}\`${companyTag}`
          : `● \`${masterId}\`${companyTag}`;
      }).join('\n');
    }
 
    function buildGroupBlock(errorSetKey, entries, showCompany) {
      const errors = deserializeErrorSet(errorSetKey);
      const sortedEvents = sortByEventPriority([...new Set(errors.map(e => e.event))]);
 
      const sortedErrors = sortedEvents.map(ev => errors.find(e => e.event === ev)).filter(Boolean);
      const statuses = [...new Set(sortedErrors.map(e => e.status))].filter(Boolean);
      const codes = [...new Set(sortedErrors.map(e => e.code))];
 
      const statusStr = statuses.length ? `\`${statuses.join('/')}\` status ` : '';
      const prefix = `${statusStr}webhook error response (\`${codes.join('/')}\`)`;
      const label = entries.length === 1 ? 'masterId' : 'masterIds';
 
      return ` ${prefix} for ${formatEventList(sortedEvents)} for the following ${label}:\n${formatMasterIdList(entries, showCompany)}`;
    }
 
    function buildSingleCompanyOutput(masterIdToErrors) {
      const grouped = new Map();
      for (const [masterId, errors] of masterIdToErrors) {
        const key = serializeErrorSet(errors);
        if (!grouped.has(key)) grouped.set(key, []);
        grouped.get(key).push({ masterId });
      }
 
      return [...grouped.entries()]
        .sort(([keyA], [keyB]) => groupPriority(keyA) - groupPriority(keyB))
        .map(([key, entries], i) =>
          (i > 0 ? '\nand' : '') + buildGroupBlock(key, entries, false)
        )
        .join('');
    }
 
    function buildMultiCompanyOutput(segments) {
      const errorSetToEntries = new Map();
      const seen = new Set();
 
      for (const { company, text } of segments) {
        const { found } = extractMasterIdErrors(normalizeText(text));
 
        for (const [masterId, errors] of found) {
          const dedupKey = `${masterId}\x02${company}`;
          if (seen.has(dedupKey)) continue;
          seen.add(dedupKey);
 
          const key = serializeErrorSet(errors);
          if (!errorSetToEntries.has(key)) errorSetToEntries.set(key, []);
          errorSetToEntries.get(key).push({ masterId, company });
        }
      }
 
      const sortedEntries = [...errorSetToEntries.entries()]
        .sort(([keyA], [keyB]) => groupPriority(keyA) - groupPriority(keyB));
 
      let output = '';
      let isFirst = true;
 
      for (const [key, entries] of sortedEntries) {
        const companies = new Set(entries.map(e => e.company));
        const isShared = companies.size > 1;
        const block = buildGroupBlock(key, entries, isShared);
 
        if (isShared) {
          output += (isFirst ? ' ' : '\nand ') + `we received${block}`;
        } else {
          const company = [...companies][0];
          output += (isFirst ? '' : '\nand ') + `for \`${company}\` we received${block}`;
        }
        isFirst = false;
      }
 
      return output;
    }
 
    function hasUnknownEvent(found) {
      for (const errors of found.values()) {
        for (const errStr of errors) {
          if (deserializeError(errStr).event === 'unknown') return true;
        }
      }
      return false;
    }
 
    function hasUnknownCode(found) {
      for (const errors of found.values()) {
        for (const errStr of errors) {
          if (deserializeError(errStr).code === 'unknown') return true;
        }
      }
      return false;
    }
 
    function formatOutput(rawText, isPlatform) {
      const missing = [];
      const warnings = [];
 
      const segments = splitIntoSegments(rawText, isPlatform);
 
      if (segments.length === 0) {
        warnings.push({ type: 'empty' });
        return { text: '', missing: [], warnings };
      }
 
      const allFound = new Map();
      
      for (const seg of segments) {
        const { found, missing: m } = extractMasterIdErrors(normalizeText(seg.text));
        
        for (const [masterId, errors] of found) {
          if (!allFound.has(masterId)) allFound.set(masterId, new Set());
          for (const err of errors) {
            allFound.get(masterId).add(err);
          }
        }
        
        missing.push(...m.map(e => ({ ...e, company: seg.company })));
 
        if (seg.clipped) warnings.push({ type: 'clipped', company: seg.company });
        if (hasUnknownEvent(found)) warnings.push({ type: 'unknown_event', company: seg.company });
        if (found.size > 0 && hasUnknownCode(found)) warnings.push({ type: 'no_error_response', company: seg.company });
      }
 
      if (allFound.size === 0 && missing.length === 0) {
        warnings.push({ type: 'empty' });
      }
 
      const companies = new Set(segments.map(s => s.company).filter(Boolean));
      const isSingleCompany = !isPlatform;
 
      if (isSingleCompany) {
        const text = allFound.size > 0
          ? `hi @channel, we received${buildSingleCompanyOutput(allFound)}`
          : '';
        return { text, missing, warnings };
      }
 
      const multiText = buildMultiCompanyOutput(segments);
      const text = multiText ? `hi @channel, ${multiText}` : '';
 
      return { text, missing, warnings };
    }
 
    const liveWarning = document.createElement('div');
    liveWarning.className = 'error-box live-warning';
    liveWarning.id = 'liveWarning';
    liveWarning.hidden = true;
    document.getElementById('input').insertAdjacentElement('afterend', liveWarning);
 
    document.getElementById('input').addEventListener('input', () => {
      if (CLIPPED_RE.test(document.getElementById('input').value)) {
        liveWarning.textContent = '⚠ Clipped message. Please open the full message in Gmail and paste the complete text';
        liveWarning.hidden = false;
      } else {
        liveWarning.hidden = true;
      }
    });

    document.getElementById('parseBtn').addEventListener('click', () => {
      const rawText = document.getElementById('input').value.trim();
      if (!rawText) return;

      const isPlatform = document.getElementById('platformCheckbox').checked;
      const { text, missing, warnings } = formatOutput(rawText, isPlatform);

      document.getElementById('output').value = text
        ? text + '\nCould you please let us know how it looks on your end?'
        : '';
 
      const errorBox = document.getElementById('errorBox');
      const lines = [];
 
      for (const w of warnings) {
        if (w.type === 'empty') {
          lines.push('⚠ Nothing could be parsed from the input - check the format');
        } else if (w.type === 'clipped') {
          const comp = w.company ? ` for <code>${w.company}</code>` : '';
          lines.push(`⚠ Message clipped${comp} - paste the full text`);
        } else if (w.type === 'no_company') {
          lines.push('⚠ One segment has no company name detected');
        } else if (w.type === 'unknown_event') {
          const comp = w.company ? ` (<code>${w.company}</code>)` : '';
          lines.push(`⚠ Unknown event type${comp} - check the raw error`);
        } else if (w.type === 'no_error_response') {
          const comp = w.company ? ` (<code>${w.company}</code>)` : '';
          lines.push(`⚠ Error response not recognized${comp} - check the raw error format`);
        }
      }
 
      for (const { event, status, code, company } of missing) {
        const parts = [];
        if (company) parts.push(`company: <code>${company}</code>`);
        if (event && event !== 'unknown') parts.push(`event: <code>${event}</code>`);
        if (status) parts.push(`status: <code>${status}</code>`);
        if (code && code !== 'unknown') parts.push(`code: <code>${code}</code>`);
        lines.push(`⚠ Letter without masterId - ${parts.join(' · ')}`);
      }
 
      errorBox.innerHTML = lines.join('<br>');
      errorBox.hidden = lines.length === 0;
    });
 
    document.getElementById('copyBtn').addEventListener('click', () => {
      const output = document.getElementById('output').value;
      if (!output) return;
 
      navigator.clipboard.writeText(output).then(() => {
        const btn = document.getElementById('copyBtn');
        const original = btn.textContent;
        btn.textContent = '✅ Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = original;
          btn.classList.remove('copied');
        }, 1600);
      }).catch(() => {});
    });
 
    document.getElementById('closeSticky').addEventListener('click', () => {
      document.getElementById('stickyNote').style.display = 'none';
    });
</script>
</body>
</html>
