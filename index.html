<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Webhook Error Parser</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Webhook Error Parser</h1>

    <label>
      <input type="checkbox" id="platformCheckbox" />
      platform company
    </label>

    <textarea id="input" placeholder="Paste raw error text here..."></textarea>
    <button id="parseBtn">Parse</button>

    <textarea id="output" placeholder="Formatted output will appear here..."></textarea>
    <button id="copyBtn">Copy Output</button>
  </div>

  <script>
    const EVENT_ORDER = [
      e => e === 'FORM_SUBMITTED',
      e => e.startsWith('LAB'),
      e => e.startsWith('BOOKING'),
      e => e === 'RX_WRITTEN',
      e => e.startsWith('PHARMACY'),
      e => e === 'CS_MESSAGE',
      e => e === 'DOCTOR_CHAT',
      e => e === 'CONSULT_CONCLUDED',
    ];

    // Non-printable separators — safe from collisions with any real field values
    const KEY_SEP   = '\x00';
    const FIELD_SEP = '\x01';

    // How many characters before the masterId position to include in each chunk.
    // Axios error payloads typically place status/code/event within ~100 chars
    // before the masterId field, so 120 gives a comfortable buffer.
    const CONTEXT_BEFORE = 120;

    // --- Pure utilities ---

    function eventPriority(event) {
      const idx = EVENT_ORDER.findIndex(fn => fn(event));
      return idx === -1 ? EVENT_ORDER.length : idx;
    }

    function sortByEventPriority(events) {
      return [...events].sort((a, b) => eventPriority(a) - eventPriority(b));
    }

    function normalizeText(raw) {
      return raw
        .replace(/\\?[\r\n]+/g, ' ')
        .replace(/[""]/g, '"')
        .replace(/(?<=\w)"(?=\w)/g, '')
        .replace(/\\"+/g, '"');
    }

    // --- Serialization ---

    function serializeError(status, code, event) {
      return [status, code, event].join(FIELD_SEP);
    }

    function deserializeError(entry) {
      const [status, code, event] = entry.split(FIELD_SEP);
      return { status, code, event };
    }

    function serializeErrorSet(errors) {
      return [...errors].sort().join(KEY_SEP);
    }

    function deserializeErrorSet(key) {
      return key.split(KEY_SEP).map(deserializeError);
    }

    // --- Parsing ---

    function extractMasterIdErrors(normalized) {
      const masterIdRe      = /["']?[Mm]aster[Ii]d["']?\s*[:=]\s*["']?[^"'\s,}]+/g;
      const masterIdPattern = /["']?[Mm]aster[Ii]d["']?\s*[:=]\s*["']?([^"'\s,}]+)/;
      const statusPattern   = /["']?status["']?\s*[:=]\s*["']?([0-9]{3}|null)["']?/;
      const codePattern     = /["']?code["']?\s*[:=]\s*["']?([A-Z_]+)["']?/;
      const eventPattern    = /["']?event["']?\s*[:=]\s*["']?([A-Z_]+)["']?/;

      const positions = [...normalized.matchAll(masterIdRe)].map(m => m.index);
      const result = new Map();

      for (let i = 0; i < positions.length; i++) {
        const chunk = normalized.slice(
          Math.max(0, positions[i] - CONTEXT_BEFORE),
          positions[i + 1] ?? normalized.length
        );

        const masterId = chunk.match(masterIdPattern)?.[1];
        if (!masterId) continue;

        const statusVal = chunk.match(statusPattern)?.[1];
        const status = statusVal && statusVal !== 'null' ? statusVal : '';
        const code   = chunk.match(codePattern)?.[1] ?? 'unknown';
        const event  = chunk.match(eventPattern)?.[1] ?? 'unknown';

        if (!result.has(masterId)) result.set(masterId, new Set());
        result.get(masterId).add(serializeError(status, code, event));
      }

      return result;
    }

    function parseSegment(text) {
      return extractMasterIdErrors(normalizeText(text));
    }

    function splitIntoCompanySegments(raw) {
      const lines = raw.split(/\r?\n/);
      const segments = [];
      let currentCompany = null;
      let currentLines = [];

      for (const line of lines) {
        const first = line.trim().split(/\s+/)[0];
        const isCompanyName = first && /^[a-z][a-z0-9]*[A-Z][A-Za-z0-9]*$/.test(first);

        if (isCompanyName) {
          if (currentLines.length) {
            segments.push({ company: currentCompany, text: currentLines.join('\n') });
          }
          currentCompany = first;
          currentLines = [line];
        } else {
          currentLines.push(line);
        }
      }

      if (currentLines.length) {
        segments.push({ company: currentCompany, text: currentLines.join('\n') });
      }

      return segments.length ? segments : [{ company: null, text: raw }];
    }

    // --- Grouping ---

    function groupByErrorSet(masterIdToErrors, company = null) {
      const map = new Map();
      for (const [masterId, errors] of masterIdToErrors) {
        const key = serializeErrorSet(errors);
        if (!map.has(key)) map.set(key, []);
        map.get(key).push({ masterId, company });
      }
      return map;
    }

    function formatEventList(events) {
      const quoted = events.map(e => `\`${e}\``);
      if (quoted.length === 1) return `${quoted[0]} event`;
      if (quoted.length === 2) return `${quoted[0]} and ${quoted[1]} events`;
      return `${quoted.slice(0, -1).join(', ')} and ${quoted.at(-1)} events`;
    }

    function formatMasterIdList(entries, showCompany) {
      const numbered = entries.length > 10;
      return entries.map(({ masterId, company }, i) => {
        const companyTag = showCompany && company ? ` for \`${company}\`` : '';
        return numbered
          ? `${i + 1}. \`${masterId}\`${companyTag}`
          : `● \`${masterId}\`${companyTag}`;
      }).join('\n');
    }

    function buildGroupBlock(errorSetKey, entries, showCompany) {
      const sortedEntries = showCompany
        ? [...entries].sort((a, b) => (a.company || '').localeCompare(b.company || ''))
        : entries;
      entries = sortedEntries;
      const errors       = deserializeErrorSet(errorSetKey);
      const sortedEvents = sortByEventPriority(errors.map(e => e.event));
      const sortedErrors = sortedEvents.map(ev => errors.find(e => e.event === ev));

      const statuses = [...new Set(sortedErrors.map(e => e.status))].filter(Boolean);
      const codes    = [...new Set(sortedErrors.map(e => e.code))];

      const statusStr = statuses.length ? `\`${statuses.join('/')}\` status ` : '';
      const prefix    = `${statusStr}webhook error response (\`${codes.join('/')}\`)`;
      const label     = entries.length === 1 ? 'masterId' : 'masterIds';

      return ` ${prefix} for ${formatEventList(sortedEvents)} for the following ${label}:\n${formatMasterIdList(entries, showCompany)}`;
    }

    function buildSingleCompanyOutput(masterIdToErrors) {
      const grouped = groupByErrorSet(masterIdToErrors);
      return [...grouped.entries()]
        .map(([key, entries], i) => (i > 0 ? '\nand' : '') + buildGroupBlock(key, entries, false))
        .join('');
    }

    function buildMultiCompanyOutput(segments) {
      const errorSetToEntries = new Map();

      const seen = new Set();
      for (const { company, text } of segments) {
        for (const [masterId, errors] of parseSegment(text)) {
          const dedupKey = masterId + '\x02' + company;
          if (seen.has(dedupKey)) continue;
          seen.add(dedupKey);
          const key = serializeErrorSet(errors);
          if (!errorSetToEntries.has(key)) errorSetToEntries.set(key, []);
          errorSetToEntries.get(key).push({ masterId, company });
        }
      }

      const shared = [];
      const uniqueByCompany = new Map();

      for (const [key, entries] of errorSetToEntries) {
        const companies = new Set(entries.map(e => e.company));
        if (companies.size > 1) {
          shared.push([key, entries]);
        } else {
          const company = [...companies][0];
          if (!uniqueByCompany.has(company)) uniqueByCompany.set(company, []);
          uniqueByCompany.get(company).push([key, entries]);
        }
      }

      const sharedBlocks = shared
        .map(([key, entries], i) =>
          (i === 0 ? ' ' : '\nand ') + `we received${buildGroupBlock(key, entries, true)}`
        )
        .join('');

      const uniqueBlocks = [...uniqueByCompany.entries()].sort((a, b) => a[0].localeCompare(b[0]))
        .flatMap(([company, groups]) =>
          groups.map(([key, entries]) =>
            `for \`${company}\` we received${buildGroupBlock(key, entries, false)}`
          )
        )
        .join('\n');

      return [sharedBlocks, uniqueBlocks].filter(Boolean).join('\n');
    }

    function formatOutput(rawText, isPlatform) {
      if (!isPlatform) {
        return `hi @channel, we received${buildSingleCompanyOutput(parseSegment(rawText))}`;
      }

      const segments = splitIntoCompanySegments(rawText).filter(s => s.company);

      if (!segments.length) {
        return `hi @channel, we received${buildSingleCompanyOutput(parseSegment(rawText))}`;
      }

      if (segments.length === 1) {
        return `hi @channel, for \`${segments[0].company}\` we received${buildSingleCompanyOutput(parseSegment(segments[0].text))}`;
      }

      return `hi @channel, ${buildMultiCompanyOutput(segments)}`;
    }

    document.getElementById('parseBtn').addEventListener('click', () => {
      const rawText = document.getElementById('input').value;
      if (!rawText.trim()) return;

      const isPlatform = document.getElementById('platformCheckbox').checked;
      document.getElementById('output').value =
        formatOutput(rawText, isPlatform) + '\nCould you please let us know how it looks on your end?';
    });

    document.getElementById('copyBtn').addEventListener('click', () => {
      const output = document.getElementById('output').value;
      if (!output.trim()) return;
      navigator.clipboard.writeText(output);
      const btn = document.getElementById('copyBtn');
      btn.textContent = '✅ Copied!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = 'Copy Output';
        btn.classList.remove('copied');
      }, 1500);
    });
  </script>
</body>
</html>
